name: m4_user
description: "M4 Group - Production Flutter WebView Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # WebView
  webview_flutter: ^4.10.0

  # API
  dio: ^5.7.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # URL Launcher (for external links)
  url_launcher: ^6.3.1

  # Shared Preferences (for theme persistence)
  shared_preferences: ^2.3.3

  # Icons
  cupertino_icons: ^1.0.8

  # Logging
  logger: ^2.5.0

  # Google Fonts (Inter font family)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
